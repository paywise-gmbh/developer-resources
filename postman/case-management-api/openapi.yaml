          type: string
    UploadedDocument:
      type: object
      properties:
        id:
          type: string
        mime_type:
          type: string
          readOnly: true
          nullable: true
        filename:
          type: string
      required:
      - filename
      - mime_type
    UploadedDocumentFileUploadRequest:
      type: object
      description: Only used for claim document upload
      properties:
        file:
          type: string
          format: binary
          writeOnly: true
          description: A document to upload. Allowed formats are pdf, jpeg and png.
            Should use multipart/form-data encoding (RFC 2388).
      required:
      - file
    UploadedDocumentRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        file:
          type: string
          format: binary
          writeOnly: true
          description: A document to upload. Allowed formats are PDF, JPEG and PNG.
            Should use multipart/form-data protocol (RFC 2388).
        filename:
          type: string
          minLength: 1
      required:
      - file
      - filename
