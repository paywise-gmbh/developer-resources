    Amount:
      type: object
      description: Amount
      properties:
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
          description: A string representation of a positive integer or decimal with
            two decimal places.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            The three-character currency code (ISO-4217).

            * `EUR` - Euro
            * `USD` - US Dollar
    AmountRequest:
      type: object
      description: Amount
      properties:
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
          description: A string representation of a positive integer or decimal with
            two decimal places.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            The three-character currency code (ISO-4217).

            * `EUR` - Euro
            * `USD` - US Dollar
    BankAccount:
      type: object
      properties:
        iban:
          type: string
          maxLength: 34
        bic:
          type: string
          nullable: true
          maxLength: 255
      required:
      - iban
    BankAccountRequest:
      type: object
      properties:
        iban:
          type: string
          minLength: 1
          maxLength: 34
        bic:
          type: string
          nullable: true
          maxLength: 255
      required:
      - iban
    BlankEnum:
      enum:
      - ''
    Claim:
      type: object
      properties:
        href:
          type: string
          format: uri
          readOnly: true
        id:
          type: string
        submission_state:
          allOf:
          - $ref: '#/components/schemas/SubmissionStateEnum'
          readOnly: true
        debtor:
          type: string
          format: uuid
          description: Your existing debtor's ID.
        mandate:
          allOf:
          - $ref: '#/components/schemas/MandateMinInfo'
          readOnly: true
          description: After a submitted claim was accepted by our team, it is added
            to a mandate.
        your_reference:
          type: string
          nullable: true
          description: Your unique reference.
          maxLength: 255
        subject_matter:
          type: string
          nullable: true
          description: A detailed description of the delivered goods or the provided
            service.
        occurence_date:
          type: string
          format: date
          nullable: true
          description: The date of emergence of the principal claim ("Vertragsdatum").
        document_reference:
          type: string
          nullable: true
          description: The unique reference of your invoice ("Rechnungsnummer"), contract
            ("Vertragsnummer") or other document ("Belegnummer").
          maxLength: 255
        document_date:
          type: string
          format: date
          nullable: true
          description: The date of your invoice ("Rechnungsdatum"), contract ("Vertragsdatum")
            or other document ("Belegdatum").
        due_date:
          type: string
          format: date
          nullable: true
          description: The date your claim was due for payment.
        reminder_date:
          type: string
          format: date
          nullable: true
          description: 'The date of your first reminder ("Mahnung") to your customer.
            Please note: the date of a "Zahlungserinnerung" does not qualify. It must
            be a "Mahnung" by german standards.'
        delay_date:
          type: string
          format: date
          nullable: true
          description: The date from which your debtor is in delay ("Verzugsdatum").
            Please check back with our team if you are unsure what to place here.
        total_claim_amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: The total **open** amount of the claim, including additional
            charges. Equals the sum of the main claim amount and the sum of all additional
            charges' amounts - minus any payments you already received on the claim.
        main_claim_amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: The **original amount** of the principal claim including VAT
            or sales tax. Does not have any additional charges added or payments subtracted.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          description: The items listed on your invoice or contract ("Rechnungsposten"
            or "Leistungen")
        additional_charges_amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: The sum of all additional charges of the claim.
        additional_charges:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalCharge'
          description: Additional charges for your claim ("incidental claims" or "Nebenforderungen").
            Those are typically reminder fees ("Mahngebühren") or bank charges for
            chargebacks ("Rücklastschriftgebühren").
        payments:
          type: array
          items:
            $ref: '#/components/schemas/ClaimPayment'
          description: Any payments you have received for your claim so far.
        starting_approach:
          allOf:
          - $ref: '#/components/schemas/StartingApproachEnum'
          description: |-
            Our starting approach to collect the claim: extrajudicial ("außergerichtlich") or judicial ("gerichtliches Mahnverfahren").

            * `extrajudicial` - Zunächst außergerichtlich starten
            * `judicial` - Gleich Mahnbescheid beantragen
        claim_disputed:
          allOf:
          - $ref: '#/components/schemas/ClaimDisputedEnum'
          description: |-
            Tell us if the claim was disputed by your customer. If you are unsure what to select here, please check back with our team.

            * `True` - Ja
            * `False` - Nein
        obligation_fulfilled:
          allOf:
          - $ref: '#/components/schemas/ObligationFulfilledEnum'
          description: |-
            Tell us if you fully fulfilled your contractual obligation towards the debtor. If you are unsure what to select here, please check back with our team.

            * `True` - Ja
            * `False` - Nein
        documents:
          type: array
          items:
            $ref: '#/components/schemas/UploadedDocument'
          readOnly: true
          description: Documents relevant for processing of the claim. Usually invoices,
            reminders, contracts or correspondence with the debtor.
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/ClaimMetaData'
          description: The metadata object allows you to submit additional relevant
            information related to the claim as type/value pairs. You can submit an
            unlimited number of metadata sets.
        events:
          type: array
          items:
            $ref: '#/components/schemas/ClaimEvent'
          description: Events regarding the claim. See request/response examples.
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - claim_disputed
      - created
      - debtor
      - delay_date
      - document_date
      - document_reference
      - documents
      - due_date
      - href
      - main_claim_amount
      - mandate
      - obligation_fulfilled
      - occurence_date
      - reminder_date
      - starting_approach
      - subject_matter
      - submission_state
      - total_claim_amount
      - updated
      - your_reference
    ClaimDisputedEnum:
      enum:
      - true
      - false
      type: boolean
      description: |-
        * `True` - Ja
        * `False` - Nein
    ClaimEvent:
      type: object
      description: Base class for events. Subclassed by other serializers.
      properties:
        type:
          $ref: '#/components/schemas/ClaimEventTypeEnum'
        title:
          type: string
          maxLength: 255
        occurence:
          type: string
          format: date-time
        your_reference:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        location:
          type: string
          nullable: true
          maxLength: 255
      required:
      - occurence
      - title
      - type
    ClaimEventRequest:
      type: object
      description: Base class for events. Subclassed by other serializers.
      properties:
        type:
          $ref: '#/components/schemas/ClaimEventTypeEnum'
        title:
          type: string
          minLength: 1
          maxLength: 255
        occurence:
          type: string
          format: date-time
        your_reference:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        location:
          type: string
          nullable: true
          maxLength: 255
      required:
      - occurence
      - title
      - type
