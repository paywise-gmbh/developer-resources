components:
  schemas:
    ActingAsEnum:
      enum:
      - consumer
      - business
      type: string
      description: |-
        * `consumer` - Verbraucher
        * `business` - Unternehmer
    AdditionalCharge:
      type: object
      properties:
        id:
          type: string
        type:
          oneOf:
          - $ref: '#/components/schemas/AdditionalChargeTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        your_reference:
          type: string
          nullable: true
          description: Your unique reference.
          maxLength: 255
        subject_matter:
          type: string
          nullable: true
          description: A description of the incidental claim. For example "Mahngebühren
            1. Mahnung".
        occurence_date:
          type: string
          format: date
          nullable: true
          description: The date the charge was initiated. For example the date of
            the reminder (reminder fee) or a chargeback fee's value date.
        document_date:
          type: string
          format: date
          nullable: true
          description: The date of the document the charge was initiated with ("Belegdatum").
        due_date:
          type: string
          format: date
          nullable: true
          description: The date your additional charge was due for payment. Applicaple
            mainly for payment reminders. Leave empty if no due date exists (for example
            in case of bank fees)
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: The amount of the additional charge.
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/ClaimMetaData'
          description: The metadata object allows you to submit additional relevant
            information related to the additional charge as type/value pairs. You
            can submit an unlimited number of metadata sets.
        events:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalChargeEvent'
          description: Events regarding the additional charge. See request/response
            examples.
      required:
      - amount
      - document_date
      - due_date
      - occurence_date
      - subject_matter
      - your_reference
    AdditionalChargeEvent:
      type: object
      description: Base class for events. Subclassed by other serializers.
      properties:
        type:
          $ref: '#/components/schemas/AdditionalChargeEventTypeEnum'
        title:
          type: string
          maxLength: 255
        occurence:
          type: string
          format: date-time
        your_reference:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        location:
          type: string
          nullable: true
          maxLength: 255
      required:
      - occurence
      - title
      - type
    AdditionalChargeEventRequest:
      type: object
      description: Base class for events. Subclassed by other serializers.
      properties:
        type:
          $ref: '#/components/schemas/AdditionalChargeEventTypeEnum'
        title:
          type: string
          minLength: 1
          maxLength: 255
        occurence:
          type: string
          format: date-time
        your_reference:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        location:
          type: string
          nullable: true
          maxLength: 255
      required:
      - occurence
      - title
      - type
    AdditionalChargeEventTypeEnum:
      enum:
      - invoice
      - transaction
      type: string
      description: |-
        * `invoice` - invoice
        * `transaction` - transaction
    AdditionalChargeRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        type:
          oneOf:
          - $ref: '#/components/schemas/AdditionalChargeTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        your_reference:
          type: string
          nullable: true
          description: Your unique reference.
          maxLength: 255
        subject_matter:
          type: string
          nullable: true
          description: A description of the incidental claim. For example "Mahngebühren
            1. Mahnung".
        occurence_date:
          type: string
          format: date
          nullable: true
          description: The date the charge was initiated. For example the date of
            the reminder (reminder fee) or a chargeback fee's value date.
        document_date:
          type: string
          format: date
          nullable: true
          description: The date of the document the charge was initiated with ("Belegdatum").
        due_date:
          type: string
          format: date
          nullable: true
          description: The date your additional charge was due for payment. Applicaple
            mainly for payment reminders. Leave empty if no due date exists (for example
            in case of bank fees)
        amount:
          allOf:
          - $ref: '#/components/schemas/AmountRequest'
          description: The amount of the additional charge.
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/ClaimMetaDataRequest'
          description: The metadata object allows you to submit additional relevant
            information related to the additional charge as type/value pairs. You
            can submit an unlimited number of metadata sets.
        events:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalChargeEventRequest'
          description: Events regarding the additional charge. See request/response
            examples.
      required:
      - amount
      - document_date
      - due_date
      - occurence_date
      - subject_matter
      - your_reference
    AdditionalChargeTypeEnum:
      enum:
      - reminder_fee
      - bank_charge
      - processing_fee
      - cancellation_fee
      - convenience_fee
      - advisory_fee
      - handling_fee
      - insurance_fee
      - legal_fee
      - delivery_charge
      - service_charge
      - data_preparation
      - communication_cost
      - expenses
      type: string
      description: |-
        * `reminder_fee` - Mahngebühr
        * `bank_charge` - Bankgebühr
        * `processing_fee` - Bearbeitungsgebühr
        * `cancellation_fee` - Abbruch-/Stornierungsgebühr
        * `convenience_fee` - Convenience fee
        * `advisory_fee` - Advisory fee
        * `handling_fee` - Handling fee
        * `insurance_fee` - Insurance fee
        * `legal_fee` - Legal fee
        * `delivery_charge` - Delivery charge
        * `service_charge` - Service charge
        * `data_preparation` - Data preparation
        * `communication_cost` - Communication cost
        * `expenses` - Expenses
